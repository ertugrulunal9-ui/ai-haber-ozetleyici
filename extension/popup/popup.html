<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Özet</title>
    <link rel="stylesheet" href="popup-base.css" />
    <link rel="stylesheet" href="popup-layout.css" />
    <link rel="stylesheet" href="popup-controls.css" />
    <link rel="stylesheet" href="popup-analysis.css" />
    <link rel="stylesheet" href="popup-stats.css" />
  </head>
  <body>
    <div class="popup-shell">
      <div class="container">
        <header class="app-header">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">AI</span>
            <span class="logo">AI &Ouml;zet</span>
          </div>
          <button id="langBtn" class="lang-btn" aria-label="Dil degistir">EN</button>
        </header>

        <!-- Ana ekran -->
        <div id="mainView" class="view">
          <p id="usageText" class="usage-text"></p>
          <!-- Daily Report Card -->
          <div id="dailyReportCard" class="daily-report-card hidden">
            <p class="daily-report-title" id="dailyReportTitle"></p>
            <p class="daily-report-line" id="dailyReportLine1"></p>
            <p class="daily-report-line" id="dailyReportLine2"></p>
            <button id="dailyReportDetailsBtn" type="button" class="daily-report-link" aria-label="Detaylı istatistikler"></button>
          </div>
          <!-- Streak Widget -->
          <div id="streakWidget" class="streak-widget hidden">
            <span class="streak-fire" id="streakIcon"></span>
            <span class="streak-text" id="streakText"></span>
            <span class="streak-best" id="streakBest"></span>
          </div>
          <button id="summarizeBtn" class="btn btn-primary">&Ouml;zetle</button>
          <button id="statsBtn" type="button" class="btn-stats">&#128202; İstatistiklerim</button>
          <div id="historySection" class="history-panel hidden">
            <h3 id="historyLabel" class="history-label">Son &Ouml;zetler</h3>
            <ul id="historyList"></ul>
          </div>
        </div>

        <!-- Stats View -->
        <div id="statsView" class="view hidden">
          <h3 class="stats-view-title" id="statsViewTitle">İstatistiklerim</h3>

          <!-- Streak Section -->
          <div class="stats-streak-section" id="statsStreakSection">
            <div class="stats-streak-row">
              <span class="streak-fire" id="statsStreakIcon"></span>
              <span id="statsStreakText"></span>
            </div>
            <div class="stats-streak-bar-wrap">
              <div class="stats-streak-bar" id="statsStreakBar"></div>
            </div>
            <p class="stats-streak-best" id="statsStreakBest"></p>
          </div>

          <!-- Weekly Numbers -->
          <div class="stats-card" id="statsWeeklyCard">
            <p class="section-label" id="statsWeeklyLabel"></p>
            <p class="stats-line" id="statsArticles"></p>
            <p class="stats-line" id="statsAnalyses"></p>
            <p class="stats-line" id="statsQuestions"></p>
            <p class="stats-line" id="statsVotes"></p>
          </div>

          <!-- Bias Map -->
          <div class="stats-card" id="statsBiasCard">
            <p class="section-label" id="statsBiasTitle"></p>
            <div id="statsBiasContent"></div>
          </div>

          <!-- Top Sources -->
          <div class="stats-card" id="statsSourcesCard">
            <p class="section-label" id="statsSourcesTitle"></p>
            <div id="statsSourcesList"></div>
          </div>

          <!-- Source Profiles -->
          <div class="stats-card" id="statsSourceProfilesCard">
            <p class="section-label" id="statsSourceProfilesTitle"></p>
            <div id="statsSourceProfilesList"></div>
          </div>

          <!-- No data message -->
          <p id="statsNoData" class="stats-no-data hidden"></p>

          <button id="statsBackBtn" class="btn btn-secondary">Geri</button>
        </div>

        <!-- Yukleniyor -->
        <div id="loadingView" class="view hidden">
          <div class="spinner"></div>
          <p id="loadingText">&Ouml;zetleniyor...</p>
        </div>

        <!-- Sonuc -->
        <div id="resultView" class="view hidden">
          <section class="summary-card">
            <h3 id="summaryLabel">&Ouml;zet</h3>
            <p id="summaryText"></p>
          </section>

          <div id="keywordsContainer" class="keywords-container hidden" data-tag-class="keyword-tag"></div>

          <button id="biasBtn" class="btn-bias">&#9878; Tarafl&#305;l&#305;k Analizi</button>

          <div id="biasSection" class="bias-card hidden">
            <p class="section-label" id="biasSectionLabel">TARAFLILIK ANALİZİ</p>
            <div class="bias-meter">
              <div class="bias-meter-labels">
                <span id="biasLeftLabel">Sol</span>
                <span id="biasPoliticalValue"></span>
                <span id="biasRightLabel">Sa&#287;</span>
              </div>
              <div class="bias-bar political-bar">
                <div id="biasPoliticalDot" class="bias-dot"></div>
              </div>
            </div>
            <div class="bias-meter">
              <div class="bias-meter-labels">
                <span id="biasObjectiveLabel">Nesnel</span>
                <span id="biasEmotionalValue"></span>
                <span id="biasEmotionalLabel">Duygusal</span>
              </div>
              <div class="bias-bar emotional-bar">
                <div id="biasEmotionalDot" class="bias-dot"></div>
              </div>
            </div>
            <p id="biasNote" class="bias-note"></p>
          </div>

          <div id="clickbaitSection" class="clickbait-card">
            <p class="section-label" id="clickbaitLabel">CLICKBAIT MI?</p>
            <div class="clickbait-vote-row">
              <button id="voteYesBtn" type="button" class="btn-vote" aria-label="Clickbait">👎 Clickbait</button>
              <button id="voteNoBtn" type="button" class="btn-vote" aria-label="Clickbait değil">👍 Değil</button>
            </div>
            <p id="clickbaitStats" class="clickbait-stats"></p>
          </div>

          <div class="share-row">
            <button id="copyBtn" class="btn-share">
              <span class="share-icon" aria-hidden="true">[]</span>
              <span id="copyLabel">Kopyala</span>
            </button>
            <button id="twitterBtn" class="btn-share btn-share-x">X Payla&#351;</button>
          </div>

          <div class="share-row feedback-row">
            <button id="feedbackGoodBtn" type="button" class="btn-share">👍</button>
            <button id="feedbackBadBtn" type="button" class="btn-share">👎</button>
          </div>

          <h3 id="sourcesLabel" class="hidden">Di&#287;er Kaynaklar</h3>
          <ul id="sourcesList"></ul>

          <div class="qa-section">
            <h3 id="qaLabel">Soru Sor</h3>
            <div class="qa-input-row">
              <input id="qaInput" type="text" placeholder="Bu haber hakkında bir şey sor..." aria-label="Soru" />
              <button id="qaBtn">&rarr;</button>
            </div>
            <p id="qaAnswer" class="hidden"></p>
          </div>

          <button id="backBtn" class="btn btn-secondary">Geri</button>
        </div>

        <!-- Limit doldu -->
        <div id="limitView" class="view hidden">
          <p id="limitText"></p>
          <button id="premiumBtn" class="btn btn-premium hidden">Premium'a Ge&ccedil;</button>
        </div>
      </div>
    </div>
    <script src="../utils/client-state.js"></script>
    <script src="../utils/ui-common.js"></script>
    <script src="../utils/summary-surface.js"></script>
    <script src="../utils/stats-engine.js"></script>
    <script src="../utils/app-core.js"></script>
    <script src="popup-ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
